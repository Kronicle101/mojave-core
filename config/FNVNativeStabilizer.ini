; Mod nativo: ninguna dependencia de NVSE ni gestor de mods.
; 0 desactiva cada función. Reinicia el juego al modificar este archivo.
[Graphics]
; Traducción de D3D9 a D3D12 de Microsoft, experimental.
; DX9 como valor inicial tras observar pantalla negra con DX12 en el juego real.
; El puente sigue disponible: EnableDX12=1 para pruebas controladas.
EnableDX12=0
; 0 respeta el modo nativo del launcher: fullscreen exclusivo si Windowed esta desmarcado.
; 1 fuerza ventana sin bordes como en la version 0.2.2.
Borderless=0
; Conservar VSync del juego/launcher. 0 solicita presentacion inmediata si el reloj esta verificado.
RespectVSync=1
; Conserva la cadena de foco y retira topmost al salir sin activar ni restaurar.
RecoverExclusiveFocus=1

[Audio]
; Usa las funciones de pausa/reanudacion de musica del propio motor y su lock.
; Reloj de audio pausado y posicion guardada en el worker nativo; evita saltos al volver.
; No se usan sesiones de audio, volumen ni mixer de Windows.
PauseEngineOnBackground=1

[Physics]
; BSTimer fraccionario para render; acumulador y paso fisico original para Havok.
; No limita FPS de render. El paso fisico permanece independiente del numero de dibujos.
; Solo instala ambos hooks si coinciden las firmas nativas del temporizador y scheduler.
EnableHighFPS=1

[Memory]
; Habilita LFH solo en el heap de proceso compatible. No reemplaza el heap del motor.
EnableProcessLFH=1

[IO]
; Caché de lecturas síncronas de BSA de solo lectura, en imports del ejecutable.
EnableCache=1
; Presupuesto máximo. No es RAM reservada: se asigna al leer, máximo 64 MiB.
CacheMiB=8
; Lectura anticipada limitada. 0 conserva el tamaño exacto de la petición.
; Deja 0 hasta comparar tiempos de carga: anticipar puede perjudicar lecturas aleatorias.
ReadAheadKiB=0
; Soltar caché propia cuando falte RAM física o espacio virtual.
MinAvailableMiB=1024
MaxMemoryLoadPercent=85
MinVirtualMiB=256

[Diagnostics]
Log=1
TelemetrySeconds=10
